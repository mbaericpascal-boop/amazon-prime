<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CamStream - Catalogue</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #141414; color: white; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; overflow-x: hidden; }
        .hero-banner { position: relative; background-size: cover; background-position: center; height: 65vh; display: flex; align-items: center; transition: background-image 0.5s ease-in-out; }
        .banner-overlay { position: absolute; top:0; left:0; right:0; bottom:0; background: linear-gradient(77deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 85%); z-index: 1; }
        .banner-content { position: relative; z-index: 2; max-width: 600px; padding-left: 50px; }
        .film-slider { display: flex; overflow-x: auto; gap: 15px; padding: 15px 0; scroll-behavior: smooth; }
        .film-slider::-webkit-scrollbar { height: 6px; }
        .film-slider::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .film-card { min-width: 220px; max-width: 220px; cursor: pointer; transition: transform 0.3s ease; position: relative; }
        .film-card:hover { transform: scale(1.08); z-index: 5; }
        .film-card img { width: 100%; height: 125px; object-fit: cover; border-radius: 4px; border: 1px solid #292929; }
        .badge-abo { position: absolute; top: 8px; right: 8px; font-size: 0.75rem; padding: 3px 6px; border-radius: 3px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="mainBanner" class="hero-banner" style="background-image: url('/images/Mboa.png');">
        <div class="banner-overlay"></div>
        <div class="banner-content">
            <h1 id="bannerTitle" class="display-4 fw-bold">Mboa</h1>
            <p id="bannerDescription" class="lead text-light">Une histoire poignante sur la vie à Douala, entre tradition et modernité.</p>
            <div class="mt-4">
                <button class="btn btn-light btn-lg me-2 px-4 fw-bold" onclick="alert('Lecture du trailer bientôt disponible.')">▶ Lecture</button>
                <button class="btn btn-secondary btn-lg px-4" onclick="alert('Ajouté à ma liste')">Plus d'infos</button>
            </div>
        </div>
    </div>

    <div class="container-fluid px-5 mt-4">
        
        <h5 class="text-white fw-bold mb-1">Films populaires au Cameroun</h5>
        <div class="film-slider mb-4">
            <div class="film-card" data-title="Mboa" data-desc="Une histoire poignante sur la vie à Douala, entre tradition et modernité." data-img="/images/Mboa.png" onclick="changerFilm(this)">
                <img src="/images/Mboa.png" alt="Mboa">
                <span class="badge-abo bg-success text-white">BASIC</span>
            </div>
            <div class="film-card" data-title="Bataille des chéries" data-desc="Intrigues, pouvoir et trahisons au cœur d'une rivalité amoureuse intense." data-img="/images/Bataille des chéries .png" onclick="changerFilm(this)">
                <img src="/images/Bataille des chéries .png" alt="Bataille des chéries">
                <span class="badge-abo bg-warning text-dark">STANDARD</span>
            </div>
            <div class="film-card" data-title="La patrie d'abord" data-desc="Un hommage plein d'action aux forces de défense engagées pour la paix." data-img="/images/La patrie d'abord.png" onclick="changerFilm(this)">
                <img src="/images/La patrie d'abord.png" alt="La patrie d'abord">
                <span class="badge-abo bg-warning text-dark">STANDARD</span>
            </div>
            <div class="film-card" data-title="Le Retour au Village" data-desc="Un jeune diplômé quitte la ville pour redécouvrir ses racines de manière hilarante." data-img="/images/Le Retour au Village.png" onclick="changerFilm(this)">
                <img src="/images/Le Retour au Village.png" alt="Le Retour au Village">
                <span class="badge-abo bg-success text-white">BASIC</span>
            </div>
            <div class="film-card" data-title="Le Juste" data-desc="Un homme intègre se dresse seul contre la corruption dans son quartier." data-img="/images/Le juste.png" onclick="changerFilm(this)">
                <img src="/images/Le juste.png" alt="Le Juste">
                <span class="badge-abo bg-danger text-white">PREMIUM</span>
            </div>
            <div class="film-card" data-title="Waka" data-desc="Le parcours courageux d'une femme bien décidée à s'en sortir face aux épreuves." data-img="/images/Waka.png" onclick="changerFilm(this)">
                <img src="/images/Waka.png" alt="Waka">
                <span class="badge-abo bg-success text-white">BASIC</span>
            </div>
        </div>

        <h5 class="text-white fw-bold mb-1">Séries Cultes</h5>
        <div class="film-slider mb-4">
            <div class="film-card" data-title="Le journal de Jennifa" data-desc="Les mésaventures délirantes d'une jeune fille pleine d'ambition." data-img="/images/Le journal de Jennifa.png" onclick="changerFilm(this)">
                <img src="/images/Le journal de Jennifa.png" alt="Le journal de Jennifa">
                <span class="badge-abo bg-success text-white">BASIC</span>
            </div>
            <div class="film-card" data-title="Pakgne" data-desc="Retrouvez les commérages et les sketchs cultes du duo incontournable." data-img="/images/Pakgne.png" onclick="changerFilm(this)">
                <img src="/images/Pakgne.png" alt="Pakgne">
                <span class="badge-abo bg-success text-white">BASIC</span>
            </div>
            <div class="film-card" data-title="L'accord" data-desc="Quand les secrets de famille et les pactes silencieux refont surface." data-img="/images/L'accord.png" onclick="changerFilm(this)">
                <img src="/images/L'accord.png" alt="L'accord">
                <span class="badge-abo bg-warning text-dark">STANDARD</span>
            </div>
            <div class="film-card" data-title="Maideut" data-desc="Intrigues amoureuses et quiproquos au sein de la bourgeoisie locale." data-img="/images/Maideut.png" onclick="changerFilm(this)">
                <img src="/images/Maideut.png" alt="Maideut">
                <span class="badge-abo bg-success text-white">BASIC</span>
            </div>
            <div class="film-card" data-title="The Plan" data-desc="Un braquage à haut risque où les trahisons s'enchaînent plus vite que prévu." data-img="/images/The plan.png" onclick="changerFilm(this)">
                <img src="/images/The plan.png" alt="The Plan">
                <span class="badge-abo bg-danger text-white">PREMIUM</span>
            </div>
        </div>

        <h5 class="text-white fw-bold mb-1">Pour les plus jeunes</h5>
        <div class="film-slider mb-5">
            <div class="film-card" data-title="Aya de Yopougon" data-desc="Chronique tendre et colorée de la vie à Abidjan à la fin des années 70." data-img="/images/Aya de Yopougon.png" onclick="changerFilm(this)">
                <img src="/images/Aya de Yopougon.png" alt="Aya de Yopougon">
                <span class="badge-abo bg-success text-white">BASIC</span>
            </div>
            <div class="film-card" data-title="Black Panther" data-desc="Le roi T'Challa défend le Wakanda et son héritage face à une menace mondiale." data-img="/images/BlackPanther.png" onclick="changerFilm(this)">
                <img src="/images/BlackPanther.png" alt="Black Panther">
                <span class="badge-abo bg-danger text-white">PREMIUM</span>
            </div>
        </div>

    </div>

    <script>
        function changerFilm(element) {
            const titre = element.getAttribute('data-title');
            const description = element.getAttribute('data-desc');
            const image = element.getAttribute('data-img');

            document.getElementById('bannerTitle').innerText = titre;
            document.getElementById('bannerDescription').innerText = description;
            document.getElementById('mainBanner').style.backgroundImage = "url('" + image + "')";
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
