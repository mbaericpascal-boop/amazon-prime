<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Catalogue - CamStream</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <a class="navbar-brand" th:href="@{/catalogue}">Cam<span>Stream</span></a>
    <div class="navbar-links">
        <a th:href="@{/catalogue}">Accueil</a>
        <a th:href="@{/profil}">Mon profil</a>
        <span th:if="${abonnement}" class="badge"
              th:classappend="${abonnement == 'PREMIUM'} ? 'badge-premium' : (${abonnement == 'STANDARD'} ? 'badge-standard' : 'badge-basic')"
              th:text="${abonnement}"></span>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="btn-logout">Déconnexion</button>
        </form>
    </div>
</nav>

<div class="page-container">
    <div class="page-header">
        <h1>🎬 Catalogue de films</h1>
        <form th:action="@{/catalogue}" method="get" class="search-bar">
            <input type="text" name="recherche" placeholder="Rechercher un film..."
                   th:value="${recherche}"/>
            <button type="submit" class="btn btn-primary">Rechercher</button>
            <a th:href="@{/catalogue}" class="btn btn-outline">Tout voir</a>
        </form>
    </div>

    <!-- FILTRES PAR GENRE -->
    <div class="filter-tabs">
        <a th:href="@{/catalogue}" class="filter-tab"
           th:classappend="${genreSelectionne == null} ? ' active' : ''">Tous</a>
        <a th:href="@{/catalogue(genre='Action')}" class="filter-tab"
           th:classappend="${genreSelectionne == 'Action'} ? ' active' : ''">Action</a>
        <a th:href="@{/catalogue(genre='Drame')}" class="filter-tab"
           th:classappend="${genreSelectionne == 'Drame'} ? ' active' : ''">Drame</a>
        <a th:href="@{/catalogue(genre='Comédie')}" class="filter-tab"
           th:classappend="${genreSelectionne == 'Comédie'} ? ' active' : ''">Comédie</a>
        <a th:href="@{/catalogue(genre='Romance')}" class="filter-tab"
           th:classappend="${genreSelectionne == 'Romance'} ? ' active' : ''">Romance</a>
        <a th:href="@{/catalogue(genre='Aventure')}" class="filter-tab"
           th:classappend="${genreSelectionne == 'Aventure'} ? ' active' : ''">Aventure</a>
    </div>

    <!-- GRILLE FILMS -->
    <div th:if="${films.isEmpty()}" style="text-align:center; padding:60px; color:#666;">
        <div style="font-size:3rem">🎬</div>
        <p style="margin-top:10px">Aucun film trouvé.</p>
    </div>

    <div class="films-grid" th:unless="${films.isEmpty()}">
        <a th:each="film : ${films}" th:href="@{/film/{id}(id=${film.id})}" class="film-card">
            <div class="film-poster">
                <span th:text="${film.genre == 'Action'} ? '💥' :
                               (${film.genre == 'Drame'} ? '🎭' :
                               (${film.genre == 'Comédie'} ? '😂' :
                               (${film.genre == 'Romance'} ? '❤️' : '🎬')))">🎬</span>
                <div class="film-poster-overlay">
                    <span class="badge"
                          th:classappend="${film.abonnementRequis == 'PREMIUM'} ? 'badge-premium' :
                                         (${film.abonnementRequis == 'STANDARD'} ? 'badge-standard' : 'badge-basic')"
                          th:text="${film.abonnementRequis}"></span>
                </div>
            </div>
            <div class="film-info">
                <h3 th:text="${film.titre}">Titre</h3>
                <div class="film-meta">
                    <span th:text="${film.genre}">Genre</span>
                    <span th:text="${film.annee}">2024</span>
                </div>
            </div>
        </a>
    </div>
</div>

</body>
</html>
