<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CamStream - Catalogue</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        :root {
            --camstream-bg: #0b0f0c; 
            --camstream-green: #00de6e; 
            --camstream-powder: rgba(0, 222, 110, 0.15); 
            --camstream-card-border: #1d3528;
        }

        body { 
            background-color: var(--camstream-bg); 
            color: white; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            overflow-x: hidden; 
        }

        /* Bannière principale avec reflet vert poudré */
        .hero-banner { 
            position: relative; 
            background-size: cover; 
            background-position: center; 
            height: 65vh; 
            display: flex; 
            align-items: center; 
            transition: background-image 0.5s ease-in-out; 
        }

        .banner-overlay { 
            position: absolute; top:0; left:0; right:0; bottom:0; 
            background: linear-gradient(77deg, rgba(11, 15, 12, 0.9) 0%, rgba(0,0,0,0) 85%),
                        radial-gradient(circle at top right, var(--camstream-powder) 0%, transparent 60%); 
            z-index: 1; 
        }

        .banner-content { position: relative; z-index: 2; max-width: 600px; padding-left: 50px; }

        /* Sliders de films */
        .film-slider { display: flex; overflow-x: auto; gap: 15px; padding: 15px 0; scroll-behavior: smooth; }
        .film-slider::-webkit-scrollbar { height: 6px; }
        .film-slider::-webkit-scrollbar-thumb { background: var(--camstream-card-border); border-radius: 4px; }

        /* Cartes de films style CamStream */
        .film-card { min-width: 220px; max-width: 220px; cursor: pointer; transition: transform 0.3s ease, border-color 0.3s ease; position: relative; }
        .film-card:hover { 
            transform: scale(1.08); 
            z-index: 5; 
            border-color: var(--camstream-green) !important;
            box-shadow: 0 0 15px var(--camstream-powder);
        }
        .film-card img { width: 100%; height: 125px; object-fit: cover; border-radius: 4px; border: 1px solid var(--camstream-card-border); }

        .badge-abo { position: absolute; top: 8px; right: 8px; font-size: 0.75rem; padding: 3px 6px; border-radius: 3px; font-weight: bold; }
        
        /* Boutons personnalisés */
        .btn-camstream-primary { background-color: var(--camstream-green); color: #000000; font-weight: bold; }
        .btn-camstream-primary:hover { background-color: #00b85c; color: #000000; box-shadow: 0 0 12px rgba(0, 222, 110, 0.5); }
        
        /* Barre de recherche prédictive */
        .search-container { position: relative; max-width: 450px; margin: 0 auto; }
        .search-input { 
            width: 100%; padding: 10px 20px; border-radius: 25px; 
            border: 1px solid var(--camstream-card-border); background-color: #111612; color: white;
            transition: border-color 0.3s;
        }
        .search-input:focus { border-color: var(--camstream-green); outline: none; box-shadow: 0 0 8px var(--camstream-powder); }
        
        .suggestions-box { 
            position: absolute; width: 100%; background: #121814; border: 1px solid var(--camstream-card-border);
            border-radius: 8px; z-index: 1000; display: none; max-height: 250px; overflow-y: auto;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.7);
        }
        .suggestion-item { display: block; padding: 12px; color: white; text-decoration: none; border-bottom: 1px solid #1a231e; }
        .suggestion-item:hover { background-color: rgba(0, 222, 110, 0.15); color: var(--camstream-green); }
    </style>
</head>
<body>

    <div class="container-fluid px-5 pt-4 d-flex justify-content-between align-items-center">
        <h3 class="fw-bold m-0" style="color: var(--camstream-green) !important;">CAMSTREAM</h3>
        
        <div class="search-container flex-grow-1 mx-4">
            <input type="text" id="searchBar" class="search-input" placeholder="Rechercher un film ou une série...">
            <div id="suggestions" class="suggestions-box"></div>
        </div>
        
        <span class="text-light" th:text="${user != null ? user.prenom : 'Invité'}">Utilisateur</span>
    </div>

    <div id="mainBanner" class="hero-banner mt-3" style="background-image: url('/images/mboa-banner.jpg');">
        <div class="banner-overlay"></div>
        <div class="banner-content">
            <h1 id="bannerTitle" class="display-4 fw-bold">Mboa</h1>
            <p id="bannerDescription" class="lead text-light">Une histoire poignante sur la vie à Douala, entre tradition et modernité.</p>
            <div class="mt-4">
                <a id="bannerLink" href="/film/1" class="btn btn-camstream-primary btn-lg me-2 px-4">▶ Lecture</a>
                <button class="btn btn-secondary btn-lg px-4" onclick="alert('Ajouté à ma liste')">Plus d'infos</button>
            </div>
        </div>
    </div>

    <div class="container-fluid px-5 mt-4">
        
        <h5 class="fw-bold mb-1" style="color: #e2e2e2;">Tout le catalogue</h5>
        <div class="film-slider mb-5">
            <div th:each="film : ${films}" class="film-card" 
                 th:data-id="${film.id}"
                 th:data-title="${film.titre}" 
                 th:data-desc="${film.description}" 
                 th:data-img="${film.imageUri}" 
                 th:data-banner="${film.afficheBanniere != null ? film.afficheBanniere : film.imageUri}"
                 onclick="changerFilm(this)">
                
                <img th:src="${film?.imageUri}" th:alt="${film?.titre}">
                
                <span th:if="${film.abonnementRequis == 'BASIC'}" class="badge-abo bg-success text-white">BASIC</span>
                <span th:if="${film.abonnementRequis == 'STANDARD'}" class="badge-abo bg-warning text-dark">STANDARD</span>
                <span th:if="${film.abonnementRequis == 'PREMIUM'}" class="badge-abo bg-danger text-white">PREMIUM</span>
            </div>
            
            <div th:if="${#lists.isEmpty(films)}" class="text-muted ps-2">
                Aucun média disponible pour le moment.
            </div>
        </div>
    </div>

    <script>
        // Changement dynamique du contenu de la bannière lors du clic sur un film
        function changerFilm(element) {
            const id = element.getAttribute('data-id');
            const titre = element.getAttribute('data-title');
            const description = element.getAttribute('data-desc');
            const banniere = element.getAttribute('data-banner');

            document.getElementById('bannerTitle').innerText = titre;
            document.getElementById('bannerDescription').innerText = description;
            document.getElementById('mainBanner').style.backgroundImage = "url('" + banniere + "')";
            document.getElementById('bannerLink').setAttribute('href', '/film/' + id);
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Requêtes asynchrones vers l'API de recherche
        document.getElementById('searchBar').addEventListener('input', function() {
            let query = this.value;
            let suggestionsBox = document.getElementById('suggestions');
            
            if (query.trim().length < 2) {
                suggestionsBox.style.display = 'none';
                return;
            }
            
            fetch(`/api/films/search?query=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(films => {
                    suggestionsBox.innerHTML = '';
                    if (films.length > 0) {
                        suggestionsBox.style.display = 'block';
                        films.forEach(film => {
                            let a = document.createElement('a');
                            a.href = `/film/${film.id}`;
                            a.className = 'suggestion-item';
                            a.innerHTML = `<strong>${film.titre}</strong> <span class="text-muted" style="font-size:0.8rem; float:right;">${film.genre}</span>`;
                            suggestionsBox.appendChild(a);
                        });
                    } else {
                        suggestionsBox.style.display = 'none';
                    }
                })
                .catch(err => console.error("Erreur de recherche asynchrone : ", err));
        });

        // Masquer les suggestions au clic extérieur
        document.addEventListener('click', function(e) {
            if (e.target.id !== 'searchBar') {
                document.getElementById('suggestions').style.display = 'none';
            }
        });
    </script>
</body>
</html>
