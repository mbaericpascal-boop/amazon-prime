<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion - CamStream</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">Cam<span>Stream</span></div>
        <h2>Connexion à votre compte</h2>

        <div th:if="${erreur}" class="alert alert-danger" th:text="${erreur}"></div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${param.inscrit}" class="alert alert-success">
            Inscription réussie ! Connectez-vous maintenant.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Adresse email</label>
                <input type="email" name="email" placeholder="votremail@gmail.com" required autofocus/>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" name="motDePasse" placeholder="••••••••" required/>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Se connecter</button>
        </form>

        <div class="auth-footer">
            Pas encore de compte ? <a th:href="@{/register}">S'inscrire gratuitement</a>
        </div>
        <div class="auth-footer" style="margin-top:10px; font-size:0.8rem; color:#555;">
            🇨🇲 Service disponible au Cameroun
        </div>
    </div>
</div>
</body>
</html>
