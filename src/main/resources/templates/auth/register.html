<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription - CamStream</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">Cam<span>Stream</span></div>
        <h2>Créer un compte</h2>

        <div th:if="${erreur}" class="alert alert-danger" th:text="${erreur}"></div>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="form-group">
                <label>Nom complet</label>
                <input type="text" th:field="*{nom}" placeholder="Jean Mbarga" required/>
            </div>
            <div class="form-group">
                <label>Adresse email</label>
                <input type="email" th:field="*{email}" placeholder="votremail@gmail.com" required/>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" th:field="*{motDePasse}" placeholder="Minimum 6 caractères" required/>
            </div>
            <div class="form-group">
                <label>Choisir votre abonnement</label>
                <select th:field="*{typeAbonnement}">
                    <option value="BASIC">BASIC — Gratuit (contenu limité)</option>
                    <option value="STANDARD">STANDARD — 2 500 FCFA/mois</option>
                    <option value="PREMIUM">PREMIUM — 5 000 FCFA/mois</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Créer mon compte</button>
        </form>

        <div class="auth-footer">
            Déjà un compte ? <a th:href="@{/login}">Se connecter</a>
        </div>
    </div>
</div>
</body>
</html>
